name: Release

# 打 tag（v1.0.0）或手动触发，都会构建四个平台的"下载即用"包并挂到 Release 上。
# 识别模型（另一个仓库）会在构建时 clone 下来打进可执行文件里，用户不需要装任何东西。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布/覆盖的 tag（例如 v1.0.0）；留空则只产出构建物、不建 Release"
        required: false
        default: ""

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # 识别模型仓库（改成你自己的地址即可）
  CAPTCHA_REPO: https://github.com/SUSTechHSAS/click-captcha-matcher.git

jobs:
  build:
    name: 构建 ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x64
          - os: windows-latest
            asset: windows-x64
          - os: macos-13        # Intel
            asset: macos-x64
          - os: macos-14        # Apple Silicon
            asset: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 取识别模型仓库
        run: git clone --depth 1 "$CAPTCHA_REPO" "${{ github.workspace }}/../click-captcha-matcher"
        shell: bash

      - name: 安装打包依赖
        run: python -m pip install --upgrade pip pyinstaller onnxruntime pillow numpy

      - name: 打包（单文件，含识别模型）
        env:
          CAPTCHA_MODEL_REPO: ${{ github.workspace }}/../click-captcha-matcher
        run: python packaging/build.py

      - name: 产物自检（不需要网络、不需要账号）
        shell: bash
        run: |
          set -e
          cd dist/course-grabber-${{ matrix.asset }}
          if [ -f course-grabber.exe ]; then BIN=./course-grabber.exe; else BIN=./course-grabber; fi
          chmod +x "$BIN" || true
          "$BIN" --version
          cp config.example.json config.json
          # 不要把输出直接管给 head —— 那会让进程吃到 BrokenPipe 而"失败"
          out=$("$BIN" --offline)
          printf '%s\n' "$out" | head -5
          # 确认识别模型确实被打进去了（跨平台用 python 量大小）
          python -c "import os,sys; s=os.path.getsize('$BIN'); print('可执行文件 %.1f MB' % (s/1048576)); sys.exit(0 if s > 10_000_000 else 1)"

      - uses: actions/upload-artifact@v4
        with:
          name: course-grabber-${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: 发布
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: 建 Release 并上传
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          gh release upload "$TAG" --repo "$REPO" --clobber artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS.txt
          echo "已发布: https://github.com/$REPO/releases/tag/$TAG"
